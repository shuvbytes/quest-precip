<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baरिश (Barish) — a second opinion on rain</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5c-3.6 5-6.5 8.6-6.5 12a6.5 6.5 0 0 0 13 0c0-3.4-2.9-7-6.5-12z' fill='%231f5fa8'/%3E%3C/svg%3E">
  <meta name="description" content="Baरिश (Barish), a second opinion on rain. ECMWF forecasts of rain over India and nearby seas: one detailed model run (HRES) next to the ensemble's chances (ENS), with exact IST time windows.">
  <!-- Leaflet 1.9.4, served from this site (vendor/), not a CDN: a blocked or unreachable CDN left the page without
       its map library ("Can't find variable: L" in Safari). Same files as cdnjs 1.9.4; the integrity hash still
       makes the browser refuse a modified file, and tests/test_build.py checks the hashes. -->
  <link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.css"
        integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==">
  <link rel="stylesheet" href="style.css">
</head>
<body data-status="loading">
  <header class="top">
    <div class="brand">
      <!-- Name mixes Latin "Ba" and Devanagari "रिश"; screen readers get the plain "Barish" instead (aria-hidden + sr-only). -->
      <h1><svg class="logo" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M12 2.5c-3.6 5-6.5 8.6-6.5 12a6.5 6.5 0 0 0 13 0c0-3.4-2.9-7-6.5-12z" fill="#1f5fa8"/><path d="M8.6 15.2a3.6 3.6 0 0 0 3 3.4" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span class="brand-name" aria-hidden="true">Baरिश</span><span class="sr-only">Barish</span></h1>
      <p class="tagline">a second opinion on rain</p>
    </div>
    <p class="run" id="run-line">Loading forecast…</p>
    <p class="run" id="updated-line"></p>
  </header>

  <main class="layout">
    <section class="map-wrap" aria-label="Map">
      <div id="map"></div>
      <div class="crosshair" id="crosshair" aria-hidden="true" hidden></div>
      <div class="cross-readout" id="cross-readout" aria-hidden="true" hidden></div>
      <section class="pcard" id="pcard" aria-label="Summary at the selected point" hidden></section>
      <!-- Swipe compare (feature 3): divider + labels; the two images are clipped at the divider by app.js -->
      <div class="swipe" id="swipe" hidden>
        <div class="swipe-line"></div>
        <button type="button" class="swipe-handle" id="swipe-handle" role="slider" aria-valuemin="5" aria-valuemax="95"
                aria-valuenow="50" aria-label="Compare divider: single run on the left, ensemble on the right">⇔</button>
      </div>
      <!-- Story mode (feature 5): steps through spots chosen by pipeline/highlights.py -->
      <section class="story" id="story" aria-label="What's interesting today" hidden>
        <p class="story-step" id="story-step"></p>
        <p class="story-cap" id="story-cap" aria-live="polite"></p>
        <div class="story-btns">
          <button type="button" id="story-back">‹ Back</button>
          <button type="button" id="story-next">Next ›</button>
          <button type="button" id="story-exit">Exit</button>
        </div>
      </section>
      <div class="swipe-labels" id="swipe-labels" hidden>
        <span class="sl-left" id="swipe-left"></span><span class="sl-right" id="swipe-right"></span>
      </div>
      <p class="sr-only" id="cross-live" aria-live="polite"></p>
      <div class="map-labels">
        <div class="showing" id="showing" aria-live="polite"></div>
        <div class="zoom-note" id="zoom-note" hidden></div>
      </div>
    </section>

    <aside class="panel" id="panel" aria-label="Map controls and legend">
      <div class="search" id="search">
        <label for="place-q" class="eyebrow">Find a place</label>
        <input id="place-q" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false"
               aria-controls="place-list" autocomplete="off" spellcheck="false" placeholder="City, e.g. Chennai">
        <ul id="place-list" role="listbox" aria-label="Matching places" hidden></ul>
        <p id="place-status" class="sr-only" aria-live="polite"></p>
      </div>

      <button type="button" class="story-open" id="story-open">What's interesting today ▸</button>

      <details class="plan" id="plan">
        <summary>Plan my day</summary>
        <div class="search plan-search">
          <label for="plan-q" class="eyebrow">Place</label>
          <input id="plan-q" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false"
                 aria-controls="plan-list" autocomplete="off" spellcheck="false" placeholder="City, or tap the map">
          <ul id="plan-list" role="listbox" aria-label="Matching places" hidden></ul>
          <p id="plan-status" class="sr-only" aria-live="polite"></p>
        </div>
        <label class="row">Day <select id="plan-day" aria-label="Day to plan (IST)"></select></label>
        <div id="plan-out" class="plan-out" aria-live="polite"></div>
      </details>

      <!-- Point panel: right after the place search, so on phones (stacked layout) it sits just below the map. -->
      <section id="point" class="point" hidden aria-live="polite" aria-label="Forecast at the selected point">
        <div class="point-head">
          <h2 id="point-title">Selected point</h2>
          <button type="button" id="point-close" class="point-close" aria-label="Close point details (Esc)">×</button>
        </div>
        <div id="point-body"></div>
      </section>
      <p class="hint" id="point-hint">Tap or click the map for the forecast at a point.</p>

      <div class="seg" role="group" aria-label="What to show">
        <button type="button" data-mode="3h">3-hour rain</button>
        <button type="button" data-mode="24h">24-hour rain &amp; chance</button>
      </div>

      <div id="box24" class="box24" hidden>
        <p class="eyebrow">Map colour shows</p>
        <div class="seg seg-big" role="group" aria-label="Map colour shows">
          <button type="button" data-fill="rain">Rain total<span>one detailed run (HRES)</span></button>
          <button type="button" data-fill="chance"><span id="chance-btn-title">Chance of rain</span><span>ensemble (ENS)</span></button>
        </div>
        <label class="row">Threshold
          <select id="x" aria-label="Rain threshold for the chance and disagreement layers"></select>
          <span>mm in 24 h</span>
        </label>
        <label class="check">
          <input type="checkbox" id="hatch" checked>
          <span>Mark where the single detailed run and the ensemble disagree</span>
        </label>
        <p class="zoom-note-inline" id="zoom-note-inline" hidden></p>
        <label class="check">
          <input type="checkbox" id="cmp">
          <span>Compare side by side: single run (left) and ensemble (right), with a draggable divider</span>
        </label>
      </div>

      <div class="time">
        <label for="t" class="eyebrow">Time window</label>
        <div class="time-row">
          <button type="button" id="prev" aria-label="Previous time window">‹</button>
          <input type="range" id="t" min="0" max="0" step="1" value="0">
          <button type="button" id="next" aria-label="Next time window">›</button>
          <button type="button" id="play" class="play" aria-pressed="false" aria-label="Play time animation">▶</button>
        </div>
        <p class="t-label" id="t-label"></p>
        <p class="t-lead" id="t-lead"></p>
      </div>

      <label class="check guide-toggle">
        <input type="checkbox" id="guide" checked>
        <span>Show the weather guide on the point card</span>
      </label>

      <div id="legend" class="legend"></div>
    </aside>
  </main>

  <footer class="foot" id="foot"></footer>

  <script src="vendor/leaflet-1.9.4/leaflet.js"
          integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg=="></script>
  <script src="app.js"></script>
</body>
</html>
