# Build the forecast site from the newest ECMWF 00z/12z run and publish it on GitHub Pages.
#
# Why these times (all UTC; GitHub cron is always UTC): ECMWF published the last file we need (ENS probabilities)
# at 08:01 UTC for the 00z run and 20:01 UTC for the 12z run (measured from Last-Modified headers on
# data.ecmwf.int, 13 Nov 2026; HRES to 144 h came at 07:34 / 19:34). We start ~20 min later (08:23 / 20:23 UTC =
# 13:53 / 01:53 IST). Minute :23 avoids the top of the hour, when GitHub delays or drops many scheduled runs.
# Then hourly at :23 for 6 hours after each run is published (08:23-13:23 and 20:23-01:23 UTC). Why: on 13 Nov GitHub
# started the 20:23 and 22:23 slots about 4 h late (00:55 and 02:31 UTC), so with two slots per run a new forecast could
# wait half a day. A scheduled run that finds the live site already showing the newest run stops early (~20 s, no
# deploy), so the extra slots cost almost nothing; they only shorten the wait when slots are delayed or dropped.
#
# A failure anywhere (download, tests, build) stops before the deploy job, so the last good site stays live; the
# page shows "Last updated" and a staleness badge, so an old forecast is visible as old.
name: Build and deploy forecast site

on:
  schedule:
    - cron: "23 8-13 * * *"       # 00z run (published ~08:01 UTC)
    - cron: "23 20-23,0-1 * * *"  # 12z run (published ~20:01 UTC)
  workflow_dispatch:
    inputs:
      skip_if_unchanged:
        description: "Behave like a scheduled run: stop if the live site already has the newest run"
        type: boolean
        default: false
      force_fail:
        description: "Test only: fail before deploying (the live site must stay unchanged)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run waits instead of cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://shuvbytes.github.io/quest-precip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}    # login shell, so the micromamba environment is active in every step
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      generated: ${{ steps.site.outputs.generated }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up the pipeline environment (environment.yml, no cartopy)
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Is there a newer run than the live site?
        id: check
        run: |
          latest=$(python pipeline/fetch.py --print-latest | tail -n1)
          live=$(curl -fsS "$SITE_URL/data/manifest.json" | python -c "import json,sys; print(json.load(sys.stdin)['run']['utc'])" || echo none)
          echo "newest complete run on ECMWF: $latest; live site: $live"
          # no explicit "exit" here: in this login shell (bash -el) it runs ~/.bash_logout, which returns 1 on the
          # Ubuntu runner and failed the step (seen in run 43444214144)
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.skip_if_unchanged }}" = "true" ]; then
            if [ "$latest" = "$live" ]; then
              skip=true
              echo "::notice::Live site already shows run $live; nothing to deploy."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Download HRES tp + ENS tpg* (newest 00z/12z run)
        if: steps.check.outputs.skip != 'true'
        run: python pipeline/fetch.py

      - name: Run tests
        if: steps.check.outputs.skip != 'true'
        run: python -m pytest -q

      - name: Build site_build/
        id: site
        if: steps.check.outputs.skip != 'true'
        run: |
          python pipeline/build.py data/raw/hres_tp_*.grib2 data/raw/ens_tpg_*.grib2
          python -c "import json; m=json.load(open('site_build/data/manifest.json')); print('built run', m['run']['utc'], '| generated', m['generated_utc'])"
          echo "generated=$(python -c "import json; print(json.load(open('site_build/data/manifest.json'))['generated_utc'])")" >> "$GITHUB_OUTPUT"
          du -sh site_build site_build/data

      - name: Forced failure (test of the failure path)
        if: steps.check.outputs.skip != 'true' && inputs.force_fail
        run: |
          echo "::error::force_fail was set: stopping before deploy; the live site must stay as it was"
          exit 1

      - uses: actions/configure-pages@v6
        if: steps.check.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.check.outputs.skip != 'true'
        with:
          path: site_build

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Make the point API (Render free web service) load the build just deployed: ask it to check now, repeatedly,
      # until it reports this build (covers CDN delay and a sleeping service, ~1 min to wake). Until then the page
      # rejects the API's answers as "different build" and uses points.bin. Never fails the deploy.
      # POST /refresh needs the bearer token (repository secret API_REFRESH_TOKEN = Render env REFRESH_TOKEN); GitHub
      # masks it in logs. Without the secret this step is skipped and the API's own 60 s checks pick up the build.
      - name: Point API loads the new build
        env:
          TOKEN: ${{ secrets.API_REFRESH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::API_REFRESH_TOKEN not set; the API will find the new build within its 60 s check."
            exit 0
          fi
          want="${{ needs.build.outputs.generated }}"
          for i in $(seq 1 12); do
            got=$(curl -sS --max-time 120 -X POST -H "Authorization: Bearer $TOKEN" "https://quest-precip-api.onrender.com/refresh" | python3 -c "import json,sys; print(json.load(sys.stdin).get('generated_utc'))" 2>/dev/null)
            echo "try $i: API has build $got, site has $want"
            [ "$got" = "$want" ] && break
            sleep 20
          done
