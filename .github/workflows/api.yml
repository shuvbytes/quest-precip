# Upload the point API (folder api/) to its Hugging Face Space, which then rebuilds the Docker image.
# Runs when api/ changes on main, or by hand. The API's tests run in deploy.yml's test step (tests/test_api.py);
# here they run again on the API alone so a broken API is never uploaded.
#
# Needs the repository secret HF_TOKEN: a fine-grained Hugging Face token with write access to this one Space only,
# created and pasted by the owner in the GitHub web UI (never in code or logs).
name: Deploy point API to Hugging Face

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space
  cancel-in-progress: false

env:
  SPACE: Shuvayandg/quest-precip-api
  SPACE_URL: https://shuvayandg-quest-precip-api.hf.space

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the API's pinned requirements and run a smoke test against the live site
        run: |
          pip install -q -r api/requirements.txt
          cd api
          uvicorn app:app --port 7860 --log-level warning &
          for i in $(seq 1 60); do [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:7860/health)" = 200 ] && break; sleep 1; done
          curl -fsS localhost:7860/health
          curl -fsS "localhost:7860/point?lat=13.08&lon=80.27" | python -c "import json,sys; j=json.load(sys.stdin); print(j['grid_point'], j['summary']['rain'])"

      - name: Upload api/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Repository secret HF_TOKEN is not set (Settings → Secrets and variables → Actions)."
            false
          else
            pip install -q huggingface_hub
            hf upload "$SPACE" api . --repo-type space --exclude "__pycache__/*" \
              --commit-message "Deploy api/ from GitHub ${GITHUB_SHA::7}"
          fi

      # Informational: the old container may answer until the new image is live; the real checks are done by hand.
      - name: Wait for the Space to rebuild and answer
        run: |
          start=$(date +%s)
          for i in $(seq 1 90); do
            if curl -fsS "$SPACE_URL/health" 2>/dev/null | grep -q '"status":"ok"'; then
              echo "Space answers after $(( $(date +%s) - start )) s:"; curl -sS "$SPACE_URL/health"; break
            fi
            sleep 10
          done
