# Pipeline + CI environment. For local development (check plots) use environment-dev.yml.
name: quest-precip
channels:
  - conda-forge
dependencies:
  - python=3.11
  - eccodes          # C library that decodes GRIB files
  - cfgrib           # lets xarray open GRIB via eccodes
  - xarray
  - numpy
  - matplotlib       # renders the map PNGs
  - pytest
  - fastapi          # point API (api/); tested in CI, deployed separately on Hugging Face
  - uvicorn
  - httpx            # API data download + FastAPI's TestClient
  - pip
  - pip:
      - ecmwf-opendata   # official ECMWF Open Data download client
